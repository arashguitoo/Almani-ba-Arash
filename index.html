<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern Deutsch mit Arash – Deutsch A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7; --paper:#ffffff; --ink:#18213b; --muted:#56607a; --line:#d5dbe7; --soft:#f5f7fb;
  --ok:#1b7f45; --okbg:#e2f3e9; --bad:#b83227; --badbg:#fbe8e5;
  --der:#2f6fdb; --die:#d24343; --das:#1f9155;
  --s1:#138a8a; --s2:#2f5aa8; --s3:#b53a50; --s4:#c47f00; --s5:#6d4a9c; --s6:#4f7d2a; --s7:#a8431f;
  --accent:var(--s1);
  --fde:Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
  --ffa:Vazirmatn, Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10152a; --paper:#1a2139; --ink:#e8ecf6; --muted:#a4adc5; --line:#303a58; --soft:#222a45;
    --ok:#5fd08e; --okbg:#16372a; --bad:#ff8a7a; --badbg:#3e201e;
    --der:#79a6f2; --die:#f27d7d; --das:#4ec486;
    --s1:#2fb5b5; --s2:#6f97e3; --s3:#e46d84; --s4:#f0aa2e; --s5:#a887d8; --s6:#8cc05a; --s7:#e5835a;
  }
}
:root[data-theme="dark"]{
  --bg:#10152a; --paper:#1a2139; --ink:#e8ecf6; --muted:#a4adc5; --line:#303a58; --soft:#222a45;
  --ok:#5fd08e; --okbg:#16372a; --bad:#ff8a7a; --badbg:#3e201e;
  --der:#79a6f2; --die:#f27d7d; --das:#4ec486;
  --s1:#2fb5b5; --s2:#6f97e3; --s3:#e46d84; --s4:#f0aa2e; --s5:#a887d8; --s6:#8cc05a; --s7:#e5835a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fde);font-size:19px;line-height:1.45}
img,canvas{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.fa{font-family:var(--ffa);direction:rtl;text-align:right;unicode-bidi:isolate;line-height:2;font-size:17px}
.de{font-family:var(--fde);direction:ltr;unicode-bidi:isolate}
.fa .de{font-size:19px;font-weight:700}
.small{font-size:15px}
.muted{color:var(--muted)}

/* Kopfzeile */
.top{background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.namebox{display:flex;align-items:center;gap:10px}
.namebox label{font-size:15px;color:var(--muted);text-align:right;line-height:1.2}
.namebox label .fa{font-size:13px;line-height:1.4}
.namebox input{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);width:200px}

/* Übersicht */
.hero{padding-top:44px;padding-bottom:30px}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.02;margin:0;font-weight:700;letter-spacing:-.5px;max-width:14ch}
.hero .h1sub{font-size:clamp(22px,3vw,30px);margin:10px 0 0;color:var(--muted);font-weight:700}
.hero .fa.title{font-size:clamp(20px,2.6vw,26px);font-weight:700;text-align:left;margin:8px 0 0}
.hero .lead{max-width:640px;margin:18px 0 0;text-align:left}
.route{list-style:none;margin:48px 0 0;padding:0 0 10px;display:flex;overflow-x:auto;scroll-snap-type:x proximity}
.stop{flex:1 0 142px;position:relative;scroll-snap-align:start}
.stop::before{content:"";position:absolute;top:38px;left:50%;width:100%;height:10px;background:var(--c);z-index:0}
.stop:last-child::before{display:none}
.stop button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;padding:0 6px 8px;border-radius:14px}
.dot{--p:0;width:86px;height:86px;border-radius:50%;position:relative;z-index:1;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--line) 0);transition:transform .2s}
.dot::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--paper)}
.dot b{position:relative;font-size:34px;color:var(--c)}
.stop.won .dot::before{background:var(--c)}
.stop.won .dot b{color:var(--paper)}
.medal{position:absolute;right:-6px;top:-6px;width:34px;height:34px;border-radius:50%;background:var(--paper);border:2px solid var(--c);display:grid;place-items:center;font-size:18px;z-index:2}
.stop button:hover .dot{transform:scale(1.06)}
.stop .nm{font-weight:700;font-size:20px;hyphens:manual;overflow-wrap:break-word;margin-top:12px;line-height:1.1}
.stop .sb{color:var(--muted);font-size:16px}
.stop .fa{text-align:center;font-size:15px;line-height:1.6;margin-top:2px}
.stop .stt{font-size:14px;margin-top:6px;color:var(--c);font-weight:700}
.nextcard{margin-top:40px;background:var(--paper);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:16px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.nextcard h2{margin:0;font-size:24px}
.nextcard p{margin:2px 0 0}
.foot{padding:30px 0 50px;color:var(--muted);font-size:15px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;padding:4px}

@media (max-width:760px){
  .route{flex-direction:column;overflow:visible;gap:14px}
  .stop{flex:none}
  .stop::before{top:50%;left:38px;width:10px;height:calc(100% + 14px)}
  .stop button{flex-direction:row;align-items:center;text-align:left;gap:18px;padding:6px 0}
  .dot{flex:0 0 86px}
  .stop .nm{margin-top:0}
  .stop .fa{text-align:left}
  .namebox input{width:150px}
}

/* Stationsansicht */
.station{padding-top:26px;padding-bottom:40px}
.back{background:none;border:0;cursor:pointer;color:var(--muted);font-size:17px;padding:6px 0;margin-bottom:10px}
.sthead{background:var(--accent);color:#fff;border-radius:22px;padding:24px 26px;display:flex;gap:22px;align-items:center}
.sthead .big{font-size:78px;font-weight:700;line-height:.8;opacity:.9}
.sthead h2{margin:0;font-size:clamp(28px,4vw,40px);line-height:1.05}
.sthead p{margin:4px 0 0;font-size:19px;opacity:.95}
.sthead .fa{text-align:left;font-size:17px;margin:0}
.steps{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.stepbtn{flex:1 1 150px;display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;text-align:left}
.stepbtn .n{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--accent);color:var(--accent);font-size:17px}
.stepbtn.done .n{background:var(--accent);color:var(--paper)}
.stepbtn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stepbtn .l{line-height:1.15;font-weight:700;font-size:17px}
.stepbtn .l .fa{display:block;font-weight:500;font-size:13px;line-height:1.5;text-align:left}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px}
.panel h3{margin:0 0 8px;font-size:25px}
.intro{margin:0 0 20px;padding:12px 16px;background:var(--soft);border-radius:12px}

/* Erklärung */
.ex{margin-bottom:26px}
.ex h4{margin:0 0 8px;font-size:21px;color:var(--accent)}
.tw{overflow-x:auto;margin:12px 0}
table.conj{border-collapse:collapse;min-width:320px;width:100%;max-width:640px}
table.conj caption{text-align:left;font-weight:700;padding:6px 0;font-size:18px}
table.conj th{font-size:15px;color:var(--muted);text-align:left;padding:6px 12px;border-bottom:2px solid var(--line)}
table.conj th.fa{text-align:right}
table.conj td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.conj td.de{font-weight:700;white-space:nowrap}
table.conj tr:nth-child(even) td{background:var(--soft)}
.end{color:var(--accent);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.twin{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.note{border-right:6px solid var(--accent);background:var(--soft);border-radius:12px;padding:12px 16px;margin:14px 0}
.exr{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.exr:last-child{border-bottom:0}
.exr p{margin:0}
.exr .de{font-size:20px;font-weight:700}
.exr .fa{text-align:left;font-size:16px;line-height:1.7}
.say{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:17px;line-height:1}
.say:hover{border-color:var(--accent)}
.say{display:inline-grid;place-items:center;color:var(--accent);padding:0}
.say .ico{width:20px;height:20px}
.pos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px;font-size:20px}
.pos span{padding:6px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.pos span.v{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
.pos span.inf{border:2px solid var(--accent);font-weight:700}
.der{color:var(--der);font-weight:700}.die{color:var(--die);font-weight:700}.das{color:var(--das);font-weight:700}
.snd td.big{font-size:23px;white-space:normal;min-width:90px}
.snd td.fa{min-width:180px}
.wbtn{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;margin:3px 4px 3px 0;cursor:pointer;font-size:18px;font-weight:700;white-space:nowrap}
.wbtn:hover{border-color:var(--accent);color:var(--accent)}
.opt.faopt{font-family:var(--ffa);font-size:22px;direction:rtl}
.vw{list-style:none;padding:0;margin:8px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.vw li{background:var(--soft);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.vw li .fa{font-size:15px;line-height:1.5}

/* Buttons */
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:2px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:14px;padding:10px 20px;cursor:pointer;font-weight:700;font-size:19px;line-height:1.2;min-height:50px}
.btn .fa{font-size:13px;font-weight:500;line-height:1.5;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}

/* Paare */
.mset{margin-bottom:28px}
.mset h4{margin:0;font-size:21px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mcard{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:19px;min-height:52px;text-align:left}
.mcard.fa{text-align:right;font-size:17px;line-height:1.5}
.mcard.sel{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--accent)}
.mcard.done{cursor:default;border-style:solid}
.mcard.c0{background:#d9f0ef;border-color:#8cc9c6;color:#12403f}
.mcard.c1{background:#dde6f7;border-color:#9bb2e0;color:#1c2f59}
.mcard.c2{background:#f6dfe3;border-color:#dea2ad;color:#5a1d29}
.mcard.c3{background:#f8ebcf;border-color:#e0bf72;color:#553900}
.mcard.c4{background:#e8def3;border-color:#bca5dc;color:#35214f}
.mcard.c5{background:#e0f0dc;border-color:#9fcf93;color:#1f4516}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.mstatus{margin:8px 0 0;font-weight:700;color:var(--ok)}

/* Quiz */
.qbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.qfill{height:100%;width:0;background:var(--accent);transition:width .3s}
.qcount{font-size:15px;color:var(--muted);margin:6px 0 14px}
.qprompt{font-size:clamp(22px,3vw,28px);font-weight:700;line-height:1.35;margin:4px 0 14px}
.qprompt .base{color:var(--muted);font-weight:400}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);padding:0 6px;text-align:center}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.bad{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.qfa{margin:-6px 0 14px;text-align:left}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;font-size:21px;font-weight:700;cursor:pointer;min-height:58px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.opt.der{color:var(--der)}.opt.die{color:var(--die)}.opt.das{color:var(--das)}
.winput{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.winput input{font:inherit;font-size:22px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);flex:1 1 220px;min-width:0}
.keys{display:flex;gap:6px;margin-top:10px}
.keys button{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-size:20px;cursor:pointer}
.bline{min-height:66px;border:2px dashed var(--accent);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:var(--soft)}
.bline:empty::before{content:"Tippe auf die Wörter";color:var(--muted);font-size:16px;padding-left:6px}
.bbank{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.tile{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-size:21px;font-weight:700;cursor:pointer}
.bline .tile{border-color:var(--accent)}
.fb{margin-top:18px;border-radius:14px;padding:14px 18px}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb strong{font-size:21px}
.fb.ok strong{color:var(--ok)}.fb.bad strong{color:var(--bad)}
.fb p{margin:6px 0}
.fb .sol{display:flex;gap:10px;align-items:center;font-size:21px}
.fb .fa{text-align:left}

/* Hausaufgabe */
.hwbox{max-width:680px}
.score{font-size:56px;font-weight:700;color:var(--accent);line-height:1;margin:10px 0}
textarea{font:inherit;font-size:20px;width:100%;min-height:170px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field input{font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);max-width:360px}
.wc{font-size:15px;color:var(--muted)}
.wc.ok{color:var(--ok);font-weight:700}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,14,30,.6);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.modal.open{display:flex}
.mbox{background:var(--paper);border-radius:20px;max-width:640px;width:100%;padding:20px;margin:auto}
.mbox canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.toast.show{opacity:1}
@media (max-width:560px){
  .panel{padding:18px}
  .sthead{padding:18px;gap:14px}
  .sthead .big{font-size:56px}
  .mgrid{gap:8px}
  .mcard{font-size:17px;padding:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Erweiterungen ===== */
:root{ --s8:#8a5a14; --s9:#2b7a9e; --s10:#9c3d73; --s11:#5a6b1f; --gold:#b7861b; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --s8:#d6a45a; --s9:#63b4da; --s10:#db7db2; --s11:#a8bd5a; --gold:#e3b54a; } }
:root[data-theme="dark"]{ --s8:#d6a45a; --s9:#63b4da; --s10:#db7db2; --s11:#a8bd5a; --gold:#e3b54a; }

.top .wrap.topin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{background:none;border:0;padding:0;cursor:pointer;text-align:left}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:none;border:2px solid transparent;border-radius:12px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:17px;line-height:1.15;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
.nav button .fa{font-size:12px;font-weight:500;line-height:1.5;text-align:center}
.nav button.on{color:var(--ink);border-color:var(--line);background:var(--soft)}
.who{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;font-size:16px}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--c,var(--s2))}
.who .pt{color:var(--gold);font-weight:700;white-space:nowrap}
.who .nm{font-weight:700;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){ .nav{order:3;width:100%;justify-content:space-between} .nav button{flex:1} }

.page{padding-top:30px;padding-bottom:50px}
.page h1{font-size:clamp(30px,4.6vw,46px);line-height:1.05;margin:0}
.page .fa.h{font-size:clamp(18px,2.4vw,22px);font-weight:700;margin:6px 0 0;text-align:left}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:22px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:18px 0}
.pcard{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--c,var(--accent))}
.pcard .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;background:var(--c,var(--s2));flex:0 0 48px}
.pcard b{display:block;font-size:20px}
.pcard small{color:var(--muted);font-size:14px}
.pcard.sel{border-color:var(--c,var(--accent));box-shadow:0 0 0 2px var(--c,var(--accent))}
.codein{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.codein input{font:inherit;font-size:24px;letter-spacing:4px;text-transform:uppercase;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);width:200px}
.err{color:var(--bad);font-weight:700;margin:8px 0 0}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--soft);color:var(--muted);vertical-align:middle}
.badge.plus{color:var(--gold);border-color:var(--gold)}
.stepbtn .opt-l{display:block;font-size:12px;color:var(--muted);font-weight:500}

function speak(t){
  if (!AUDIO) return;
  try{
    if(!("speechSynthesis" in window)) return;

{
  id:"aussprache", color:"var(--s7)", de:"Lesen & Aussprache", sub:"Deutsch richtig lesen", fa:"خواندن و تلفظ",
  buildIntro:"جملهٔ آلمانی با حروف فارسی نوشته شده است. آن را بخوان و با زدن روی کلمه‌ها همان جمله را با حروف آلمانی بساز.",

/* ---------- Profile & Speicher ---------- */
const LKEY = "ldma-lernpfad-v1", OLDKEY = "ldma-a1-lernstationen-v1";
function newProfile(x){ return Object.assign({code:null, name:"", level:"basis", role:"", group:"", st:{}, best:{}, points:0}, x); }
function migrateSt(st){
  const o = {};
  for (const k in st){
    const s = st[k] || {}, old = s.steps || [];
    o[k] = {steps:[!!old[0], !!old[1], !!old[2], !!old[3], false, !!old[4]], hw:s.hw || null};
  }
  return o;
}
function loadL(){
  try { const o = JSON.parse(localStorage.getItem(LKEY)); if (o && o.profiles) return o; } catch(e){}
  const l = {active:null, profiles:{}, guests:[]};
  try {
    const old = JSON.parse(localStorage.getItem(OLDKEY));
    if (old && old.st && Object.keys(old.st).length){
      l.profiles.gast = newProfile({name:old.name || "", st:migrateSt(old.st)});
      l.active = "gast";
    }
  } catch(e){}
  return l;
}
let L = loadL();
if (!L.guests) L.guests = [];
let P = L.active && L.profiles[L.active] ? L.profiles[L.active] : null;
function saveL(){ try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch(e){} }
function st(id){
  if (!P.st[id]) P.st[id] = {steps:[false,false,false,false,false,false], hw:null};
  const s = P.st[id];
  if (!Array.isArray(s.steps)) s.steps = Object.values(s.steps || {});
  while (s.steps.length < 6) s.steps.push(false);
  return s;
}
function pushStation(id){ if (P && P.code && db) R(`progress/${P.code}/${id}`).set(clean(st(id))).catch(() => {}); }
function markStep(id, i){ const s = st(id); if (!s.steps[i]){ s.steps[i] = true; saveL(); pushStation(id); } }
function needSteps(s){ const r = [0,1,2,3,HW]; if (P && P.level === "plus" && s.plus) r.splice(4, 0, PROFI); return r; }
function stepsDone(s){ const d = st(s.id); return needSteps(s).filter(k => d.steps[k]).length; }
function colorOf(name){ let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PCOL[h % PCOL.length]; }
function initial(n){ return (String(n || "?").trim()[0] || "?").toUpperCase(); }
function roleLbl(r){ return ROLES[r] || null; }

/* Punkte: zählt nur Verbesserungen pro Station und Schritt */
function bestOf(id, key){ return ((P.best || {})[id] || {})[key] || 0; }
function setBest(id, key, v){
  P.best = P.best || {}; P.best[id] = P.best[id] || {};
  P.best[id][key] = v; saveL();
  if (P.code && db) R(`best/${P.code}/${id}/${key}`).set(v).catch(() => {});
}
function improve(id, key, val, factor){
  const old = bestOf(id, key);
  if (val <= old) return 0;
  setBest(id, key, val);
  const pts = Math.round((val - old) * (factor || 1));
  addPoints(pts);
  return pts;
}
function addPoints(n){
  if (!P || n <= 0) return;
  P.points = (P.points || 0) + n; saveL(); renderWho();
  if (P.code && db) R(`points/${P.code}`).transaction(v => (v || 0) + n).catch(() => {});
  const t = $("#ptoast"); t.textContent = `+${n} ★`; t.classList.add("show");
  clearTimeout(addPoints._t); addPoints._t = setTimeout(() => t.classList.remove("show"), 1800);
}
function logEv(e){
  if (!(P && P.code && db)) return;
  e.ts = TS();
  R(`log/${P.code}`).push(clean(e)).catch(() => {});
  R(`seen/${P.code}`).set(TS()).catch(() => {});
}
function logFor(code, e){ if (!(code && db)) return; e.ts = TS(); R(`log/${code}`).push(clean(e)).catch(() => {}); R(`seen/${code}`).set(TS()).catch(() => {}); }
function pointsFor(code, n){
  if (n <= 0) return;
  const p = L.profiles[code];
  if (p){ p.points = (p.points || 0) + n; saveL(); }
  if (code && db) R(`points/${code}`).transaction(v => (v || 0) + n).catch(() => {});
}

function mergeSt(a, b){
  const o = Object.assign({}, a);
  for (const id in (b || {})){
    const x = o[id] || {steps:[], hw:null}, y = b[id] || {};
    const ys = Array.isArray(y.steps) ? y.steps : Object.values(y.steps || {});
    const steps = [0,1,2,3,4,5].map(k => !!((x.steps || [])[k] || ys[k]));
    let hw = x.hw || null;
    if (y.hw && (!hw || (y.hw.passed && !hw.passed) || ((y.hw.score || 0) > (hw.score || 0)))) hw = y.hw;
    o[id] = {steps, hw};
  }
  return o;
}
function mergeBest(a, b){
  const o = JSON.parse(JSON.stringify(a || {}));
  for (const id in (b || {})){ o[id] = o[id] || {}; for (const k in b[id]) o[id][k] = Math.max(o[id][k] || 0, b[id][k] || 0); }
  return o;
}
function hasProgress(p){ return p && Object.values(p.st || {}).some(s => (s.steps || []).some(Boolean)); }

async function fetchMember(code){
  const snap = await withTimeout(R(`members/${code}`).get(), 9000);
  if (!snap.exists()) { const e = new Error("notfound"); e.code = "notfound"; throw e; }
  return snap.val();
}
async function loginCode(raw){
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length < 4){ const e = new Error("short"); e.code = "short"; throw e; }
  if (!db){ const e = new Error("offline"); e.code = "offline"; throw e; }
  const m = await fetchMember(code);
  if (m.active === false){ const e = new Error("inactive"); e.code = "inactive"; throw e; }
  const [prog, best, pts] = await Promise.all(["progress","best","points"].map(k => withTimeout(R(`${k}/${code}`).get(), 9000).then(s => s.val())));
  const p = L.profiles[code] || newProfile({code});
  Object.assign(p, {code, name:m.name || code, level:m.level || "basis", role:m.role || "", group:m.group || ""});
  p.st = mergeSt(p.st || {}, prog || {});
  p.best = mergeBest(p.best || {}, best || {});
  p.points = Math.max(pts || 0, 0);
  L.profiles[code] = p; L.active = code; P = p; saveL();
  R(`seen/${code}`).set(TS()).catch(() => {});
  return {code, freshRemote: !prog};
}
function transferGuest(){
  const g = L.profiles.gast; if (!g || !P.code) return;
  P.st = mergeSt(P.st, g.st); P.best = mergeBest(P.best, g.best);
  saveL();
  R(`progress/${P.code}`).set(clean(P.st)).catch(() => {});
  R(`best/${P.code}`).set(clean(P.best)).catch(() => {});
  logEv({k:"import", n:Object.keys(g.st || {}).length});
  delete L.profiles.gast; saveL();
}
/* Profil im Hintergrund auffrischen (Stufe, Name, Fortschritt anderer Geräte) */
let pointsRef = null;
function watchProfile(){
  if (pointsRef){ pointsRef.off(); pointsRef = null; }
  if (!(P && P.code && db)) return;
  const code = P.code;
  pointsRef = R(`points/${code}`);
  pointsRef.on("value", s => { if (P && P.code === code){ P.points = s.val() || 0; saveL(); renderWho(); } });
  Promise.all([R(`members/${code}`).get(), R(`progress/${code}`).get(), R(`best/${code}`).get()]).then(([m, pr, b]) => {
    if (!P || P.code !== code) return;
    if (m.exists()){
      const v = m.val();
      if (v.active === false){ L.active = null; P = null; saveL(); renderStart("Dieser Code ist nicht mehr aktiv. · این کد دیگر فعال نیست."); return; }
      const lvlChanged = P.level !== (v.level || "basis");
      Object.assign(P, {name:v.name || code, level:v.level || "basis", role:v.role || "", group:v.group || ""});
      if (lvlChanged) toast("Neue Stufe: " + LEVELS[P.level][0]);
    }
    P.st = mergeSt(P.st, pr.val() || {}); P.best = mergeBest(P.best, b.val() || {});
    saveL(); renderWho();
    if (VIEW === "home") renderHome();
  }).catch(() => {});
}

/* ---------- Station ---------- */
let cur = {i:0, step:0};
function openStation(i, step){
  const s = STATIONS[i];
  const d = st(s.id);
  const visible = [0,1,2,3,PROFI,HW].filter(k => k !== PROFI || s.plus);
  if (step === undefined){ step = needSteps(s).find(k => !d.steps[k]); if (step === undefined) step = HW; }
  if (step === PROFI && !s.plus) step = HW;
  cur = {i, step};
  setNav("home");
  AUDIO = s.audio !== false;
  document.documentElement.style.setProperty("--accent", s.color);
  const app = $("#app");
  app.innerHTML = `
  <section class="station wrap">
    <button class="back" id="backBtn">‹ Übersicht <span class="fa" style="font-size:14px">صفحهٔ اصلی</span></button>
    <div class="sthead">
      <div class="big">${i+1}</div>
      <div><h2>${s.de}</h2><p>${s.sub}</p><p class="fa">${s.fa}</p></div>
    </div>
    <nav class="steps" aria-label="Schritte">${visible.map((k, n) => { const p = STEPS[k]; const opt = k === PROFI && P.level !== "plus"; return `<button class="stepbtn${d.steps[k] ? " done" : ""}${k === step ? " active" : ""}" data-step="${k}" ${k === step ? 'aria-current="step"' : ""}><span class="n">${d.steps[k] ? "✓" : (k === PROFI ? "★" : n + 1 - (k > PROFI && s.plus ? 1 : 0))}</span><span class="l">${p.de}<span class="fa">${p.fa}</span>${opt ? `<span class="opt-l">freiwillig · اختیاری</span>` : ""}</span></button>`; }).join("")}</nav>
    <div class="panel" id="panel"></div>
  </section>`;
  $("#backBtn").addEventListener("click", renderHome);
  app.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => openStation(i, +b.dataset.step)));
  const panel = $("#panel");
  ({0:stepExplain, 1:stepMatch, 2:stepPractice, 3:stepBuild, 4:stepProfi, 5:stepHomework})[step](s, panel, i);
}
function goNext(i, step){ openStation(i, step); const n = $(".steps"); if (n) n.scrollIntoView({behavior:"smooth", block:"start"}); }
function nextAfterBuild(s){ return s.plus ? PROFI : HW; }
function nextBtn(i, step, de, fa){ return `<div class="actions"><button class="btn primary" data-go="${step}">${de}<span class="fa">${fa}</span></button></div>`; }
function wireGo(panel, i){ panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => goNext(i, +b.dataset.go))); }
const wrongPack = list => list.slice(0, 15).map(it => ({q:String(it.t === "b" ? it.fa : it.q).slice(0, 140), g:String(it._given || "").slice(0, 120), r:solutionOf(it).slice(0, 140)}));

function stepExplain(s, panel, i){
  const t0 = Date.now();
  panel.innerHTML = `<h3>Erklärung</h3><div class="intro fa">توضیح را با دقت بخوان.${AUDIO ? " روی دکمهٔ صدا بزن تا جمله را بشنوی." : ""}</div>${s.explain}
    <div class="actions"><button class="btn primary" id="gotIt">Verstanden – zu den Wörtern<span class="fa">فهمیدم، برویم سراغ واژه‌ها</span></button></div>`;
  $("#gotIt").addEventListener("click", () => {
    const first = !st(s.id).steps[0];
    markStep(s.id, 0);
    logEv({k:"explain", s:s.id, sec:Math.round((Date.now() - t0) / 1000)});
    if (first) addPoints(1);
    goNext(i, 1);
  });
}

function stepMatch(s, panel, i){
  const t0 = Date.now();
  panel.innerHTML = `<h3>Wörter: Paare finden</h3><div class="intro fa">اول روی یک کلمهٔ آلمانی بزن، بعد روی معنی درستش.${AUDIO ? " کلمه‌های آلمانی را هم می‌شنوی." : ""}</div><div id="mhost"></div><div id="mdone"></div>`;
  renderMatch($("#mhost"), s.match, errors => {
    markStep(s.id, 1);
    const perfectSets = errors.filter(e => e === 0).length;
    improve(s.id, "m", s.match.length * 2 + perfectSets, 1);

/* ---------- Paare ---------- */
function renderMatch(host, sets, onDone){
  host.innerHTML = "";
  let left = sets.length;
  const errs = [];
  sets.forEach((set, si) => {
    const box = document.createElement("div");
    box.className = "mset";
    box.innerHTML = `<h4>${set.title}</h4><p class="fa small" style="margin:0">${set.fa || ""}</p><div class="mgrid"><div class="mcol" lang="de"></div><div class="mcol"></div></div><p class="mstatus"></p>`;
    const [Lc, Rc] = box.querySelectorAll(".mcol");
    const pairs = set.pairs.map((p, k) => ({de:p[0], other:p[1], k}));
    let sel = null, matched = 0, errors = 0;
    const mk = (p, side) => {
      const b = document.createElement("button");
      const isFa = side === "R" && !set.rightDe;
      b.className = "mcard" + (isFa ? " fa" : "");
      if (isFa) b.dir = "rtl"; else b.lang = "de";
      b.textContent = side === "L" ? p.de : p.other;
      b.dataset.k = p.k; b.dataset.side = side;
      b.addEventListener("click", () => pick(b));
      return b;
    };
    shuffle(pairs).forEach(p => Lc.append(mk(p, "L")));
    shuffle(pairs).forEach(p => Rc.append(mk(p, "R")));
    function pick(b){
      if (b.classList.contains("done")) return;
      if (b.lang === "de") speak(b.textContent.replace(/\(.*\)/, ""));
      if (!sel || sel.dataset.side === b.dataset.side){
        if (sel) sel.classList.remove("sel");
        sel = (sel === b) ? null : b;
        if (sel) sel.classList.add("sel");
        return;
      }
      if (sel.dataset.k === b.dataset.k){
        const c = "c" + (matched % 6);
        [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done", c); x.setAttribute("aria-disabled", "true"); });
        matched++; sel = null;
        if (matched === pairs.length){
          box.querySelector(".mstatus").textContent = errors === 0 ? "Perfekt – ohne Fehler! ✓" : `Geschafft ✓ (${errors} Fehlversuche)`;
          errs[si] = errors;
          left--; if (!left) onDone(errs);
        }
      } else {
        errors++;
        [sel, b].forEach(x => { x.classList.remove("sel", "shake"); void x.offsetWidth; x.classList.add("shake"); });
        sel = null;
      }
    }
    host.append(box);
  });
}

/* ---------- Aufgaben ---------- */
function solutionOf(it){
  if (it.t === "b") return cap(it.a[0]) + it.p;
  const ans = it.t === "c" ? it.o[it.a] : it.a[0];
  return it.q.includes("___") ? it.q.replace("___", ans) : ans;
}
/* Eine Aufgabe zeichnen; onAnswer(ok, given) wird genau einmal aufgerufen */
function renderItem(w, it, onAnswer){
  const gapHtml = q => esc(q).replace("___", '<span class="gap">&nbsp;</span>');
  if (it.t === "c"){
    w.innerHTML = `<div class="qprompt" lang="de" dir="auto">${gapHtml(it.q)}</div>${it.art ? `<p class="fa qfa">${it.fa}</p>` : ""}<div class="opts" lang="de"></div>`;
    const opts = w.querySelector(".opts");
    shuffle(it.o.map((o, k) => ({o, k}))).sort((x, y) => it.art ? x.k - y.k : 0).forEach(({o, k}) => {
      const b = document.createElement("button");
      b.className = "opt" + (it.art ? " " + o : "") + (/[؀-ۿ]/.test(o) ? " faopt" : "");
      b.textContent = o;
      b.addEventListener("click", () => {
        const ok = k === it.a;
        opts.querySelectorAll("button").forEach(x => { x.disabled = true; });
        b.classList.add(ok ? "ok" : "bad");
        if (!ok) [...opts.children].find(x => x.textContent === it.o[it.a]).classList.add("ok");
        const g = w.querySelector(".gap");
        if (g){ g.textContent = o; g.classList.add(ok ? "ok" : "bad"); }
        onAnswer(ok, o);
      });
      opts.append(b);
    });
  } else if (it.t === "w"){
    w.innerHTML = `<div class="qprompt" lang="de">${gapHtml(it.q)}${it.base ? ` <span class="base">(${esc(it.base)})</span>` : ""}</div>
      <div class="winput"><input type="text" lang="de" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Deine Antwort"><button class="btn primary chk">Prüfen<span class="fa">بررسی</span></button></div>
      <div class="keys">${["ä","ö","ü","ß"].map(k => `<button type="button" data-k="${k}" aria-label="${k} einfügen">${k}</button>`).join("")}</div>`;
    const inp = w.querySelector("input"), chk = w.querySelector(".chk");
    w.querySelectorAll("[data-k]").forEach(k => k.addEventListener("click", () => {
      const p = inp.selectionStart ?? inp.value.length;
      inp.value = inp.value.slice(0, p) + k.dataset.k + inp.value.slice(inp.selectionEnd ?? p);
      inp.focus(); inp.setSelectionRange(p + 1, p + 1);
    }));
    const check = () => {
      if (!inp.value.trim()){ toast("Bitte schreib eine Antwort."); inp.focus(); return; }
      const ok = it.a.some(a => norm(a) === norm(inp.value));
      inp.disabled = true; chk.disabled = true;
      w.querySelectorAll("[data-k]").forEach(k => k.disabled = true);
      const g = w.querySelector(".gap");
      if (g){ g.textContent = inp.value.trim(); g.classList.add(ok ? "ok" : "bad"); }
      onAnswer(ok, inp.value.trim());
    };
    chk.addEventListener("click", check);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    setTimeout(() => inp.focus({preventScroll:true}), 50);
  } else {
    w.innerHTML = `<p class="fa" style="font-size:20px;font-weight:700;margin:0 0 4px">${it.fa}</p><p class="muted small" style="margin:0 0 12px">Bilde den Satz auf Deutsch.</p>
      <div class="bline" lang="de" aria-live="polite"></div><div class="bbank" lang="de"></div>
      <div class="actions"><button class="btn primary chk">Prüfen<span class="fa">بررسی</span></button><button class="btn rst">Zurücksetzen<span class="fa">از نو</span></button></div>`;
    const line = w.querySelector(".bline"), bank = w.querySelector(".bbank");
    let order = shuffle(it.w.map((x, k) => k));
    for (let t = 0; t < 6 && it.a.some(a => norm(a) === norm(order.map(k => it.w[k]).join(" "))); t++) order = shuffle(order);
    let placed = [], locked = false;
    const draw = () => {
      line.innerHTML = ""; bank.innerHTML = "";
      placed.forEach(k => { const b = document.createElement("button"); b.className = "tile"; b.textContent = it.w[k]; b.addEventListener("click", () => { if (locked) return; placed = placed.filter(x => x !== k); draw(); }); line.append(b); });
      order.filter(k => !placed.includes(k)).forEach(k => { const b = document.createElement("button"); b.className = "tile"; b.textContent = it.w[k]; b.addEventListener("click", () => { if (locked) return; placed.push(k); draw(); }); bank.append(b); });
    };
    draw();
    w.querySelector(".rst").addEventListener("click", () => { if (!locked){ placed = []; draw(); } });
    w.querySelector(".chk").addEventListener("click", () => {
      if (locked) return;
      if (placed.length !== it.w.length){ toast("Benutze alle Wörter."); return; }
      const user = placed.map(k => it.w[k]).join(" ");
      const ok = it.a.some(a => norm(a) === norm(user));
      locked = true;
      w.querySelectorAll(".actions .btn").forEach(b => b.disabled = true);
      line.style.borderColor = ok ? "var(--ok)" : "var(--bad)";
      onAnswer(ok, user);
    });
  }
}
function feedbackHtml(it, ok, opt){
  opt = opt || {};
  const sol = solutionOf(it);
  const pr = PRAISE[Math.floor(Math.random() * PRAISE.length)];
  return (ok
    ? `<strong>${pr[0]}</strong> <span class="fa">${pr[1]}</span>`
    : `<strong>Nicht ganz.</strong> <span class="fa">نه کاملاً. جواب درست:</span>`)
    + `<p class="sol" lang="de">${AUDIO ? `<button class="say" data-say="${esc(it.say || sol)}" aria-label="Vorlesen">${ICON}</button>` : ""}<b dir="auto">${esc(sol)}</b>${it.say && it.say !== sol ? ` <span class="muted">(${esc(it.say)})</span>` : ""}</p>`
    + (it.fa && it.t !== "b" && !it.art ? `<p class="fa">${it.fa}</p>` : "")
    + (!ok && it.tip ? `<p class="fa">💡 ${it.tip}</p>` : "")
    + (opt.extra || "")
    + `<div class="actions" style="margin-top:10px"><button class="btn primary nx">${opt.nextDe || "Weiter"}<span class="fa">${opt.nextFa || "بعدی"}</span></button></div>`;
}
function runQuiz(host, items, mode, onFinish){
  const hw = mode === "hw";
  const t0 = Date.now();
  let queue = shuffle(items.map((it, k) => Object.assign({}, it, {_k:k})));
  const total = items.length;
  let answered = 0, correct = 0;
  const solved = new Set(), failed = new Set();
  const wrongList = [];
  host.innerHTML = `<div class="qbar"><div class="qfill"></div></div><div class="qcount"></div><div class="qcard"></div>`;
  const fill = host.querySelector(".qfill"), count = host.querySelector(".qcount"), card = host.querySelector(".qcard");
  function progress(){
    const done = hw ? answered : solved.size;
    fill.style.width = (done / total * 100) + "%";
    count.textContent = hw ? `Aufgabe ${Math.min(answered + 1, total)} von ${total}` : `${solved.size} von ${total} gelöst`;
  }
  function next(){
    progress();
    if (!queue.length){ onFinish({correct, total, wrongList, firstOk: total - failed.size, sec:Math.round((Date.now() - t0) / 1000)}); return; }
    show(queue.shift());
  }
  function show(it){
    const w = document.createElement("div");
    w.className = "qitem";
    card.innerHTML = ""; card.append(w);
    const box = document.createElement("div");
    w.append(box);
    renderItem(box, it, (ok, given) => {
      answered++;
      if (ok){ correct++; solved.add(it._k); }
      else {
        if (!hw) queue.push(it);
        if (!failed.has(it._k)) wrongList.push(Object.assign({}, it, {_given:given}));
        failed.add(it._k);
      }
      const fb = document.createElement("div");
      fb.className = "fb " + (ok ? "ok" : "bad");
      fb.innerHTML = feedbackHtml(it, ok, {extra: !ok && !hw ? `<p class="fa small muted">این سؤال دوباره در آخر می‌آید.</p>` : ""});
      w.append(fb);
      const nx = fb.querySelector(".nx");
      nx.addEventListener("click", next);
      nx.focus({preventScroll:true});
      fb.scrollIntoView({behavior:"smooth", block:"nearest"});
      if (ok) speak(it.say || solutionOf(it));
    });
  }
  next();
}

/* ---------- Zertifikat ---------- */
function wrapLines(ctx, text, maxW){
  const out = [];
  String(text).split(/\n+/).forEach(par => {
    let line = "";
    par.split(/\s+/).filter(Boolean).forEach(word => {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxW && line){ out.push(line); line = word; } else line = test;
    });
    if (line) out.push(line);
  });
  return out;
}
const HEXC = {"var(--s1)":"#138a8a","var(--s2)":"#2f5aa8","var(--s3)":"#b53a50","var(--s4)":"#c47f00","var(--s5)":"#6d4a9c","var(--s6)":"#4f7d2a","var(--s7)":"#a8431f","var(--s8)":"#8a5a14","var(--s9)":"#2b7a9e","var(--s10)":"#9c3d73","var(--s11)":"#5a6b1f"};
async function drawCertificate(i){
  const s = STATIONS[i], d = st(s.id), hw = d.hw;
  try { await Promise.all(["700 40px Carlito","400 30px Carlito","700 40px Vazirmatn","400 30px Vazirmatn"].map(f => document.fonts.load(f))); } catch(e){}
  const hexOf = k => HEXC[STATIONS[k].color] || "#18213b";
  const col = hexOf(i);
  const W = 1240, H = 1754;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");

function wireTopics(sel){
  const box = $("#topics");
  const sync = () => box.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", sel.includes(b.dataset.t)));
  box.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { const k = sel.indexOf(b.dataset.t); if (k >= 0) sel.splice(k, 1); else sel.push(b.dataset.t); sync(); }));
  $("#tAll").addEventListener("click", () => { sel.splice(0, sel.length, ...STATIONS.map(s => s.id)); sync(); });
  $("#tDone").addEventListener("click", () => { const d = STATIONS.filter(s => (st(s.id).steps || []).some(Boolean)).map(s => s.id); sel.splice(0, sel.length, ...(d.length ? d : STATIONS.map(s => s.id))); sync(); });
}
function defaultTopics(){ const d = STATIONS.filter(s => st(s.id).steps[0] || st(s.id).steps[2]).map(s => s.id); return d.length ? d : STATIONS.slice(1, 4).map(s => s.id); }
function poolFor(level, ids, onlyChoice){
  const base = [], plus = [];
  STATIONS.filter(s => ids.includes(s.id)).forEach(s => {
    const tag = it => Object.assign({_s:s.id}, it);
    s.practice.forEach(it => base.push(tag(it)));
    s.hw.items.forEach(it => base.push(tag(it)));
    s.build.forEach(it => base.push(tag(Object.assign({t:"b"}, it))));
    (s.plus || []).forEach(it => plus.push(tag(it)));
  });
  const f = a => onlyChoice ? a.filter(it => it.t === "c") : a;
  return level === "plus" ? shuffle(f(plus)).concat(shuffle(f(base))) : shuffle(f(base));
}

function duelEnd(){
  const list = DU.players.slice().sort((a, b) => b.score - a.score);
  const best = list[0].score;

  const names = DU.players.map(p => p.name);

    const pts = p.correct + (win ? 3 : 0) + 1;
    pointsFor(p.code, pts);
    logFor(p.code, {k:"duell", s:DU.topics.join(","), c:p.correct, n:Math.ceil(DU.q / DU.players.length) || DU.rounds, sec, win, with:names.filter(n => n !== p.name), w:wrongPack(p.wrong)});
  });
  if (P && P.code) watchProfile();
  renderWho();
  document.documentElement.style.setProperty("--accent", "var(--s5)");
  const winners = list.filter(p => p.score === best).map(p => p.name);
  $("#app").innerHTML = `<section class="page wrap"><h1>${winners.length > 1 ? "Unentschieden!" : esc(winners[0]) + " gewinnt!"}</h1>
    <p class="fa h">${winners.length > 1 ? "مساوی!" : esc(winners[0]) + " برنده شد!"} 🎉</p>
    ${podiumHtml(list)}
    <div class="card"><ul style="margin:0;padding-left:20px">${list.map(p => `<li><b>${esc(p.name)}</b>: ${p.correct} richtig${p.code ? ` · +${p.correct + (p.score === best && best > 0 ? 3 : 0) + 1} ★` : ""}</li>`).join("")}</ul>
    <p class="small-note">Punkte bekommen nur Personen mit Code. · فقط کسانی که کد دارند امتیاز می‌گیرند.</p></div>
    <div class="actions"><button class="btn primary" id="again">Nochmal<span class="fa">دوباره</span></button><button class="btn" id="toPlay">Andere Spiele<span class="fa">بازی‌های دیگر</span></button></div></section>`;
  const keep = DU;
  $("#again").addEventListener("click", () => {
    keep.players.forEach(p => { p.score = 0; p.correct = 0; p.wrong = []; });
    DU = Object.assign(keep, {turn:0, q:0, t0:Date.now()});
    duelTurn();
  });
  $("#toPlay").addEventListener("click", renderPlay);
}

/* ---------- Live-Raum (mehrere Handys) ---------- */
let LV = null;
function stopLive(){
  if (LV){ if (LV.ref) LV.ref.off(); clearTimeout(LV.timer); clearInterval(LV.tick); }
  LV = null;
}
function myPid(){ if (P.code) return P.code; if (!L.dev){ L.dev = "g" + Math.random().toString(36).slice(2, 8); saveL(); } return L.dev; }
function renderLiveStart(){
  setNav("play");
  if (!db){ $("#app").innerHTML = `<section class="page wrap"><h1>Live-Raum</h1><p class="err">Keine Verbindung zum Server. · اتصال به سرور برقرار نیست.</p></section>`; return; }
  const topics = defaultTopics();
  let n = 10, secs = 25;
  $("#app").innerHTML = `<section class="page wrap">
    <button class="back" id="backPlay">‹ Zurück <span class="fa" style="font-size:14px">برگشت</span></button>
    <h1>Live-Raum</h1><p class="fa h">اتاق زنده – هر کس با گوشی خودش</p>
    <div class="grid2">
      <div class="card"><h2 style="margin:0 0 4px">Raum beitreten</h2><p class="fa" style="margin:0">کد چهاررقمی اتاق را بنویس.</p>
        <form class="codein" id="joinForm"><input id="roomIn" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Raum-Code"><button class="btn primary" type="submit">Beitreten<span class="fa">ورود</span></button></form><p class="err" id="joinErr" hidden></p></div>
      <div class="card"><h2 style="margin:0 0 4px">Neuen Raum öffnen</h2><p class="fa" style="margin:0">تو اتاق را باز می‌کنی و بازی را شروع می‌کنی.</p>
        <p class="lbl">Themen<span class="fa">موضوع‌ها</span></p>${topicChips(topics)}
        <p class="lbl">Fragen<span class="fa">تعداد سؤال</span></p><div class="chips" id="nQ">${[5,10,15].map(x => `<button class="chip${x === n ? " on" : ""}" data-n="${x}">${x}</button>`).join("")}</div>
        <p class="lbl">Zeit pro Frage<span class="fa">زمان هر سؤال</span></p><div class="chips" id="nS">${[15,25,40].map(x => `<button class="chip${x === secs ? " on" : ""}" data-s="${x}">${x} s</button>`).join("")}</div>
        <div class="actions"><button class="btn primary" id="mkRoom">Raum öffnen<span class="fa">باز کردن اتاق</span></button></div></div>
    </div></section>`;
  wireTopics(topics);
  $("#nQ").querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => { n = +b.dataset.n; $("#nQ").querySelectorAll("[data-n]").forEach(x => x.classList.toggle("on", x === b)); }));
  $("#nS").querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => { secs = +b.dataset.s; $("#nS").querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x === b)); }));
  $("#backPlay").addEventListener("click", renderPlay);
  $("#joinForm").addEventListener("submit", async e => {
    e.preventDefault();
    const code = $("#roomIn").value.replace(/\D/g, ""), err = $("#joinErr");
    err.hidden = true;
    try {
      const s = await withTimeout(R(`rooms/${code}`).get(), 9000);
      const v = s.val();
      if (!v || nowS() - (v.created || 0) > 12 * 3600e3){ err.textContent = "Diesen Raum gibt es nicht. · این اتاق وجود ندارد."; err.hidden = false; return; }
      if (v.status === "end"){ err.textContent = "Dieses Spiel ist schon vorbei. · این بازی تمام شده است."; err.hidden = false; return; }
      await joinRoom(code);
    } catch(ex){ err.textContent = "Keine Verbindung. · اتصال برقرار نشد."; err.hidden = false; }
  });
  $("#mkRoom").addEventListener("click", async () => {
    if (!topics.length){ toast("Bitte ein Thema wählen · یک موضوع انتخاب کن"); return; }
    const strip1 = it => clean({q:it.q, o:it.o, a:it.a, fa:it.fa || null, tip:it.tip || null, art:!!it.art, s:it._s});
    const qb = poolFor("basis", topics, true).slice(0, n).map(strip1);
    const qp = poolFor("plus", topics, true).slice(0, n).map(strip1);
    const nn = Math.min(qb.length, qp.length);
    if (nn < 3){ toast("Zu wenige Fragen – mehr Themen wählen · موضوع بیشتری انتخاب کن"); return; }
    let code = null;
    for (let t = 0; t < 6; t++){
      const c = String(1000 + Math.floor(Math.random() * 9000));
      const ex = (await R(`rooms/${c}`).get()).val();
      if (!ex || nowS() - (ex.created || 0) > 12 * 3600e3){ code = c; break; }
    }
    if (!code){ toast("Bitte nochmal versuchen"); return; }
    await R(`rooms/${code}`).set({created:TS(), host:myPid(), hostName:P.name || "", status:"lobby", n:nn, secs, idx:0, t0:0, topics:topics.join(","), qs:{b:qb.slice(0, nn), p:qp.slice(0, nn)}});
    await joinRoom(code);
  });
}
async function joinRoom(code){
  stopLive();
  const pid = myPid();
  await R(`rooms/${code}/players/${pid}`).update({name:P.name || "Gast", level:P.level || "basis", code:P.code || null, score:0, at:TS()});
  LV = {code, pid, ref:R(`rooms/${code}`), shown:null, timer:null, tick:null, logged:false};
  LV.ref.on("value", snap => { const v = snap.val(); if (LV && LV.code === code) liveRender(v); });
}
function liveRanking(room){ return Object.entries(room.players || {}).map(([pid, p]) => Object.assign({pid, color:colorOf(p.name)}, p)).sort((a, b) => (b.score || 0) - (a.score || 0)); }
function liveRender(room){
  if (!room){ stopLive(); renderPlay(); toast("Raum geschlossen · اتاق بسته شد"); return; }
  const isHost = room.host === LV.pid;
  const key = room.status + ":" + room.idx;
  const app = $("#app");
  document.documentElement.style.setProperty("--accent", "var(--s5)");
  const players = liveRanking(room);
  if (room.status === "lobby"){
    LV.shown = key;
    app.innerHTML = `<section class="page wrap"><h1>Live-Raum</h1><p class="fa h">کد اتاق را به بقیه بگو:</p>
      <div class="card" style="margin-top:16px;text-align:center"><div class="roomcode">${LV.code}</div>
      <p class="muted">${room.n} Fragen · ${room.secs} s</p></div>
      <p class="lbl">Im Raum (${players.length})<span class="fa">در اتاق</span></p>
      <div class="sbar">${players.map(p => `<span style="--c:${p.color}"><i></i>${esc(p.name)}${p.level === "plus" ? " ★" : ""}</span>`).join("")}</div>
      ${isHost ? `<div class="actions"><button class="btn primary" id="liveGo" ${players.length < 1 ? "disabled" : ""}>Spiel starten<span class="fa">شروع بازی</span></button></div>` : `<p class="wait">Warte auf den Start … · منتظر شروع بازی …</p>`}
      <p style="margin-top:20px"><button class="linkbtn" id="leave">Raum verlassen · خروج از اتاق</button></p></section>`;
    if (isHost) $("#liveGo").addEventListener("click", () => LV.ref.update({status:"q", idx:0, t0:TS()}));
    $("#leave").addEventListener("click", () => { stopLive(); renderPlay(); });
    return;
  }
  const me = (room.players || {})[LV.pid] || {level:P.level};
  const set = (room.qs || {})[me.level === "plus" ? "p" : "b"] || [];
  if (room.status === "q"){
    const ans = ((room.ans || {})[room.idx] || {});
    const nAns = Object.keys(ans).length;
    if (isHost){
      clearTimeout(LV.timer);
      const left = (room.t0 || nowS()) + room.secs * 1000 - nowS();
      if (nAns >= players.length) liveReveal(room);
      else LV.timer = setTimeout(() => LV.ref.once("value").then(s => { const v = s.val(); if (v && v.status === "q" && v.idx === room.idx) liveReveal(v); }), Math.max(0, left) + 400);
    }
    if (LV.shown === key){ const c = $("#ansCount"); if (c) c.textContent = `${nAns} / ${players.length}`; return; }
    LV.shown = key;
    const it = set[room.idx];
    if (!it){ return; }
    const q = Object.assign({t:"c"}, it);
    app.innerHTML = `<section class="page wrap">
      <p class="muted small" style="margin:0">Frage ${room.idx + 1} von ${room.n} · <span id="ansCount">${nAns} / ${players.length}</span> geantwortet</p>
      <div class="timer"><i id="tbar"></i></div>
      <div class="panel"><div class="qitem" id="lq"></div></div>
      ${isHost ? `<p style="margin-top:14px"><button class="linkbtn" id="forceReveal">Auflösen · نمایش جواب</button></p>` : ""}</section>`;
    if (isHost) $("#forceReveal").addEventListener("click", () => LV.ref.once("value").then(s => liveReveal(s.val())));
    const total = room.secs * 1000;
    const bar = $("#tbar");
    clearInterval(LV.tick);
    let done = !!ans[LV.pid];
    const tickF = () => {
      const left = Math.max(0, (room.t0 || nowS()) + total - nowS());
      if (bar) bar.style.width = (left / total * 100) + "%";
      if (left <= 0){ clearInterval(LV.tick); if (!done){ done = true; $("#lq").insertAdjacentHTML("beforeend", `<p class="wait">Zeit ist um! · وقت تمام شد!</p>`); $("#lq").querySelectorAll("button").forEach(b => b.disabled = true); } }
    };
    LV.tick = setInterval(tickF, 200); tickF();
    const box = document.createElement("div"); $("#lq").append(box);
    renderItem(box, q, ok => {
      if (done) return;
      done = true;
      const ms = Math.max(0, nowS() - (room.t0 || nowS()));
      const pts = ok ? 500 + Math.round(500 * Math.max(0, 1 - ms / total)) : 0;
      R(`rooms/${LV.code}/ans/${room.idx}/${LV.pid}`).set({ok, ms, pts}).catch(() => {});
      $("#lq").insertAdjacentHTML("beforeend", `<p class="wait">${ok ? "Richtig! · درست!" : "Leider falsch. · متأسفانه غلط."} Warte auf die anderen … · منتظر بقیه …</p>`);
    });
    if (ans[LV.pid]){ $("#lq").querySelectorAll("button").forEach(b => b.disabled = true); $("#lq").insertAdjacentHTML("beforeend", `<p class="wait">Schon beantwortet · جواب داده‌ای</p>`); }
    return;
  }
  clearInterval(LV.tick); clearTimeout(LV.timer);
  if (room.status === "r"){
    if (LV.shown === key) return;
    LV.shown = key;
    const it = Object.assign({t:"c"}, set[room.idx] || {});
    const my = ((room.ans || {})[room.idx] || {})[LV.pid];
    const last = room.idx + 1 >= room.n;
    app.innerHTML = `<section class="page wrap"><p class="muted small" style="margin:0">Frage ${room.idx + 1} von ${room.n}</p>
      <div class="fb ${my && my.ok ? "ok" : "bad"}"><strong>${my ? (my.ok ? `Richtig! +${my.pts}` : "Falsch") : "Keine Antwort"}</strong> <span class="fa">${my ? (my.ok ? "درست!" : "غلط") : "جوابی ندادی"}</span>
      <p class="sol" lang="de"><b>${esc(it.q ? solutionOf(it) : "")}</b></p>${it.fa && !it.art ? `<p class="fa">${it.fa}</p>` : ""}${it.tip ? `<p class="fa">💡 ${it.tip}</p>` : ""}</div>
      <ol class="rank">${players.map((p, k) => `<li class="${p.pid === LV.pid ? "me" : ""}" style="--c:${p.color}"><span class="pl">${k + 1}</span><span class="av">${esc(initial(p.name))}</span><div><b>${esc(p.name)}</b></div><span class="sc">${p.score || 0}</span></li>`).join("")}</ol>
      ${isHost ? `<div class="actions"><button class="btn primary" id="liveNext">${last ? "Ergebnis zeigen" : "Nächste Frage"}<span class="fa">${last ? "نتیجهٔ نهایی" : "سؤال بعدی"}</span></button></div>` : `<p class="wait">Gleich geht's weiter … · الان ادامه می‌دهیم …</p>`}</section>`;
    if (isHost) $("#liveNext").addEventListener("click", () => {
      if (last) LV.ref.update({status:"end"});
      else LV.ref.update({status:"q", idx:room.idx + 1, t0:TS()});
    });
    return;
  }
  if (room.status === "end"){
    if (LV.shown === key) return;
    LV.shown = key;
    const myAns = Object.values(room.ans || {}).map(a => (a || {})[LV.pid]).filter(Boolean);
    const correct = myAns.filter(a => a.ok).length;
    const top = players.length ? players[0].score || 0 : 0;
    const win = players.length > 1 && (me.score || 0) === top && top > 0;
    const doneKey = LV.code + ":" + (room.created || 0);
    L.liveDone = L.liveDone || {};
    if (P.code && !L.liveDone[doneKey]){
      L.liveDone[doneKey] = 1; saveL();
      addPoints(correct + (win ? 5 : 0) + 1);
      logEv({k:"live", s:room.topics || "", c:correct, n:room.n, win, with:players.filter(p => p.pid !== LV.pid).map(p => p.name)});
    }
    const list = players.map(p => ({name:p.name, score:p.score || 0, color:p.color}));
    app.innerHTML = `<section class="page wrap"><h1>Ergebnis</h1><p class="fa h">نتیجهٔ نهایی 🎉</p>${podiumHtml(list)}
      <div class="card"><p style="margin:0">Du hast ${correct} von ${room.n} Fragen richtig beantwortet. · ${faNum(correct)} جواب درست از ${faNum(room.n)}.</p>${P.code ? "" : `<p class="small-note">Ohne Code werden keine Punkte gespeichert.</p>`}</div>
      <div class="actions"><button class="btn primary" id="toPlay">Zurück<span class="fa">برگشت</span></button></div></section>`;
    $("#toPlay").addEventListener("click", () => { stopLive(); renderPlay(); });
  }
}
function liveReveal(room){
  if (!room || room.status !== "q" || !LV) return;
  const code = LV.code, idx = room.idx;
  R(`rooms/${code}/rev/${idx}`).transaction(cur => cur ? undefined : true).then(res => {
    if (!res.committed) return;
    return R(`rooms/${code}`).once("value").then(s => {
      const v = s.val(); if (!v) return;
      const a = ((v.ans || {})[idx]) || {};
      const upd = {status:"r"};
      Object.entries(v.players || {}).forEach(([pid, p]) => { upd[`players/${pid}/score`] = (p.score || 0) + ((a[pid] && a[pid].pts) || 0); });
      return R(`rooms/${code}`).update(upd);
    });
  }).catch(() => {});
}

/* ---------- Start ---------- */
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });
try { if ("speechSynthesis" in window) speechSynthesis.getVoices(); } catch(e){}
renderWho();
if (P){ watchProfile(); renderHome(); } else renderStart();

</script>
